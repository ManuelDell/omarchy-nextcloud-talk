name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python tests (offline, against the bundled fake Talk server)
        run: python3 -B -m unittest discover -s tests

      - name: UI model tests
        run: node plugins/omanctalk/tests/models.cjs

      - name: Manifest is valid JSON
        run: python3 -m json.tool manifest.json > /dev/null
