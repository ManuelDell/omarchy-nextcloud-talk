name: Bug report
description: Report a reproducible OmaNCTalk problem without private chat data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Never attach app passwords, the local mirror (talk.db), server URLs of
        private instances, room tokens, user names, message text, files, or
        screenshots of real conversations.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The smallest steps, using invented data (a throw-away test room helps).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OmaNCTalk commit, Omarchy version, Nextcloud and Talk versions.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all private data (credentials, rooms, people, messages) from this report.
          required: true
